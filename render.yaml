# Company brain. One image: the app, Postgres, and the embedder.
# Render builds it. A disk holds the database. Do not use the free instance:
# it sleeps, and a sleeping service does not sync.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: company-brain
    runtime: docker
    plan: 1c-2g
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: "off"
    disk:
      name: company-brain-pg
      mountPath: /var/lib/postgresql
      sizeGB: 10
    envVars:
      - key: MCP_API_KEY
        generateValue: true
      - key: GDRIVE_FOLDER_ID
        sync: false
      - key: GDRIVE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: EXTRACTION_API_KEY
        sync: false
      - key: EXTRACTION_BASE_URL
        value: https://opencode.ai/inference/go/openai/v1
      - key: EXTRACTION_MODEL
        value: deepseek-v4.1-flash
